name: Checks

# Actions minutes are limited, so each run does only what its change needs:
# - PRs that touch only docs skip CI. A new push to a PR cancels the run it replaces.
# - The balance reports (most of a run's minutes) run on PRs that touch the rules or content.
# - Layout screenshots run on PRs that touch what is drawn.
# - A merge to main already passed all of this as a PR, so it runs lint and tests, builds the
#   APK and publishes it, and skips the reports and screenshots.
# - "Run workflow" by hand runs everything.
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/**
      - .github/ISSUE_TEMPLATE/**
      - .github/CODEOWNERS
      - .github/dependabot.yml
      - .github/pull_request_template.md
  workflow_dispatch:

concurrency:
  # A PR's runs share a group, so a new push cancels the old run. Every other run gets a group of
  # its own: a shared group would also drop a queued merge to main, which must publish its build.
  group: ${{ github.event_name == 'pull_request' && format('checks-pr-{0}', github.event.pull_request.number) || format('checks-run-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  checks:
    name: Lint and tests
    runs-on: ubuntu-latest
    # A stalled step must not bill for hours (one apt-get once held a runner for six).
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
    outputs:
      screens: ${{ steps.scope.outputs.screens }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick the slow checks this change needs
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          balance=true
          screens=true
          if [ "$EVENT" = push ]; then
            balance=false
            screens=false
          elif [ "$EVENT" = pull_request ]; then
            # grep exits 2 on a bad pattern; that must fail the run, not quietly skip a check.
            touches() {
              local rc=0
              grep -qE "$1" <<< "$files" || rc=$?
              if [ "$rc" -gt 1 ]; then
                echo "::error::Bad file pattern: $1"
                exit 1
              fi
              return "$rc"
            }
            if files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)'); then
              printf 'Changed files:\n%s\n' "$files"
              if ! touches '^(scripts/(sim|core)/|data/|tools/auto[a-z]*\.gd$|tools/ci_godot\.sh$|\.github/(actions|workflows/checks\.yml))'; then
                balance=false
              fi
              if ! touches '^(scripts/|data/|art/|scenes/|tools/(shot\.gd|ci_godot\.sh)$|project\.godot$|\.github/(actions|workflows/checks\.yml))'; then
                screens=false
              fi
            else
              echo "::warning::Could not list the PR's files, so every check runs."
            fi
          fi
          echo "balance=$balance screens=$screens"
          {
            echo "balance=$balance"
            echo "screens=$screens"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.5.0"  # pinned: formatter output must not drift
      - name: Check formatting
        run: gdformat --check -l 100 scripts tests tools
      - name: Lint
        run: gdlint scripts tests tools
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - name: Run tests
        run: tools/ci_godot.sh --headless --path . -s tests/run_tests.gd
      - name: Balance report (40 seeded fights per policy)
        if: steps.scope.outputs.balance == 'true'
        run: |
          tools/ci_godot.sh --headless --path . -s tools/autobattle.gd -- 40
          cp godot.log balance.txt
      - name: Run report (20 seeded whole runs per hull by each autopilot profile)
        if: steps.scope.outputs.balance == 'true'
        # 20, not 40: there are two profiles now and skilled runs go further, so this keeps
        # the step's minutes about where one profile at 40 had them.
        run: |
          tools/ci_godot.sh --headless --path . -s tools/autorun.gd -- 20
          cat godot.log >> balance.txt
      - name: Add balance to the run summary
        if: always() && steps.scope.outputs.balance == 'true'
        run: |
          {
            echo '### Auto-battle balance'
            echo '```'
            grep -E 'wins|runs' balance.txt || echo 'no balance output (see the step log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    # The APK and the screenshots share one runner, so Godot is set up once, not twice.
    name: Android APK and layout screenshots
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - name: Cache export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          # Only the Android templates are kept: the full set is over 1 GB and took half a
          # minute to restore on every build.
          key: godot-templates-android-${{ env.GODOT_VERSION }}
      - name: Install export templates
        if: steps.templates.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          curl -fsSL --retry 3 --connect-timeout 30 --max-time 480 -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz 'templates/android_*' templates/version.txt
          rm templates.tpz
          ls templates
          mkdir -p ~/.local/share/godot/export_templates
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Point Godot at the Android SDK and Java
        run: |
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
            cat > ~/.config/godot/$f <<CFG
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          CFG
          done
      - name: Check for a signing key in repo secrets
        id: secret_key
        # A key kept in secrets never expires. Without one, fall back to a key kept in the
        # Actions cache, which GitHub drops after 7 days without a build.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$KEYSTORE_BASE64$KEYSTORE_PASSWORD" ]; then
              echo "::warning::Only one of ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD is set, so this build uses the cached key instead (docs/INSTALL.md)."
            fi
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore the cached debug keystore
        if: steps.secret_key.outputs.found != 'true'
        id: keystore
        uses: actions/cache@v4
        with:
          # One keystore for every build, so a tester can install a new APK over
          # the old one and keep their saves.
          path: debug.keystore
          key: android-debug-keystore-v1
      - name: Make a debug keystore
        if: steps.secret_key.outputs.found != 'true' && steps.keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "::warning::Made a new signing key. Phone builds signed with the old key must be uninstalled first. Add the ANDROID_KEYSTORE_* secrets to stop this (docs/INSTALL.md)."
      - name: Sign with the chosen key
        env:
          FROM_SECRETS: ${{ steps.secret_key.outputs.found }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ "$FROM_SECRETS" = true ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > debug.keystore
            user="${KEY_ALIAS:-emberwake}"
            password="$KEYSTORE_PASSWORD"
          else
            user=androiddebugkey
            password=android
          fi
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$PWD/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=$user"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Number this build
        id: version
        # Each CI build gets a higher versionCode, so a phone installs it over the last one, and a
        # version name ending in the build number, so updaters like Obtainium can compare builds.
        # run_number restarts at 1 if this workflow file is renamed or replaced: keep the name, or
        # add an offset above the last published code.
        run: |
          base=$(sed -n 's/^version\/name="\(.*\)"$/\1/p' export_presets.cfg)
          if ! [[ "$base" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Expected one version/name like \"0.0.1\" in export_presets.cfg, got: $base"
            exit 1
          fi
          name="$base.${{ github.run_number }}"
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"$name\"/" export_presets.cfg
          grep -E '^version/(code|name)=' export_presets.cfg
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/wickfarer-debug.apk
          ls -la build
          test -s build/wickfarer-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wickfarer-android-debug
          path: build/wickfarer-debug.apk
          retention-days: 14
      - name: Install a virtual display
        if: needs.checks.outputs.screens == 'true'
        timeout-minutes: 5
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1 > /dev/null
      - name: Capture phone and foldable layouts
        if: needs.checks.outputs.screens == 'true'
        timeout-minutes: 10
        run: |
          mkdir -p screens
          while read -r w h name; do
            for screen in fight chart event store title pause options; do
              xvfb-run -a -s "-screen 0 2600x2600x24" godot --path . --rendering-driver opengl3 \
                -s tools/shot.gd -- "$w" "$h" "screens/$name-$screen.png" 300 "$screen" < /dev/null
              test -s "screens/$name-$screen.png"
            done
          done <<LIST
          2400 1080 phone-20x9
          2520 1080 fold7-cover
          2184 1968 fold7-open
          1968 2184 fold7-open-portrait
          2556 1179 iphone-16
          1080 2520 fold7-cover-portrait
          1080 2340 phone-portrait
          LIST
      - uses: actions/upload-artifact@v4
        if: needs.checks.outputs.screens == 'true'
        with:
          name: layout-screenshots
          path: screens/
          retention-days: 14

  release:
    name: Publish the phone build
    # Every green build of main becomes a GitHub Release, so the newest APK is always at
    # releases/latest/download/wickfarer.apk and updaters like Obtainium can follow it.
    # It is a debug export on purpose: it is for our own test phones, not a store.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash  # -eo pipefail, so a failed gh call fails the step
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      # CI releases are recognised by this title suffix; hand-made releases never carry it.
      CI_MARK: "(CI build)"
      KEEP_BUILDS: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wickfarer-android-debug
          path: build
      - name: Give the APK its stable name
        run: |
          test -n "$VERSION"
          mv build/wickfarer-debug.apk build/wickfarer.apk
      - name: Create or update the release
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            # A re-run of the same build: replace the APK, keep the notes.
            gh release upload "$tag" build/wickfarer.apk --clobber
          else
            gh release create "$tag" build/wickfarer.apk --target "$GITHUB_SHA" --latest=false \
              --title "Wickfarer $VERSION $CI_MARK" --generate-notes
          fi
      - name: Mark the newest build as latest
        # Release jobs can finish out of order, and re-runs publish old builds, so "latest" goes
        # to the highest build number rather than to whichever job finished last.
        run: |
          ci_tags=$(gh release list --limit 200 --exclude-drafts --json tagName,name \
            --jq ".[] | select(.name | endswith(\" $CI_MARK\")) | .tagName")
          newest=$(awk -F. '{print $NF, $0}' <<< "$ci_tags" | sort -n | tail -n 1 | cut -d" " -f2)
          gh release edit "$newest" --latest
          {
            echo "### Phone build $VERSION"
            echo "Latest is $newest: https://github.com/$GH_REPO/releases/latest/download/wickfarer.apk"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Delete old builds
        run: |
          ci_tags=$(gh release list --limit 200 --exclude-drafts --json tagName,name \
            --jq ".[] | select(.name | endswith(\" $CI_MARK\")) | .tagName")
          awk -F. '{print $NF, $0}' <<< "$ci_tags" | sort -nr | cut -d" " -f2 | tail -n +$((KEEP_BUILDS + 1)) | while read -r old; do
            echo "Deleting $old"
            gh release delete "$old" --yes --cleanup-tag
          done
