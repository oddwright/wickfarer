name: Checks

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.5.0"  # pinned: formatter output must not drift
      - name: Check formatting
        run: gdformat --check -l 100 scripts tests tools
      - name: Lint
        run: gdlint scripts tests tools

  test:
    name: Headless tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - name: Run tests
        run: tools/ci_godot.sh --headless --path . -s tests/run_tests.gd
      - name: Balance report (40 seeded fights per policy)
        run: |
          tools/ci_godot.sh --headless --path . -s tools/autobattle.gd -- 40
          cp godot.log balance.txt
      - name: Run report (40 seeded Reach runs by the autopilot)
        run: |
          tools/ci_godot.sh --headless --path . -s tools/autorun.gd -- 40
          cat godot.log >> balance.txt
      - name: Add balance to the run summary
        if: always()
        run: |
          {
            echo '### Auto-battle balance'
            echo '```'
            grep -E 'wins|runs' balance.txt || echo 'no balance output (see the step log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android debug APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - name: Cache export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}
      - name: Install export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Point Godot at the Android SDK and Java
        run: |
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
            cat > ~/.config/godot/$f <<CFG
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          CFG
          done
      - name: Restore the debug keystore
        id: keystore
        uses: actions/cache@v4
        with:
          # One keystore for every build, so a tester can install a new APK over
          # the old one and keep their saves.
          path: debug.keystore
          key: android-debug-keystore-v1
      - name: Make a debug keystore
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Use the debug keystore
        run: |
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$PWD/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Number this build
        # Each CI build gets a higher versionCode, so devices and testers can tell builds apart.
        run: sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/emberwake-debug.apk
          ls -la build
          test -s build/emberwake-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: emberwake-android-debug
          path: build/emberwake-debug.apk
          retention-days: 14

  screens:
    name: Layout screenshots
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install a virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1 > /dev/null
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - name: Capture phone and foldable layouts
        run: |
          mkdir -p screens
          while read -r w h name; do
            xvfb-run -a -s "-screen 0 2600x2300x24" godot --path . --rendering-driver opengl3 \
              -s tools/shot.gd -- "$w" "$h" "screens/$name.png" 300 < /dev/null
            test -s "screens/$name.png"
          done <<LIST
          2400 1080 phone-20x9
          2520 1080 fold7-cover
          2184 1968 fold7-open
          1968 2184 fold7-open-portrait
          2556 1179 iphone-16
          LIST
      - uses: actions/upload-artifact@v4
        with:
          name: layout-screenshots
          path: screens/
          retention-days: 14
