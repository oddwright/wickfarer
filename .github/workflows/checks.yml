name: Checks

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.*"
      - name: Check formatting
        run: gdformat --check -l 100 scripts tests tools
      - name: Lint
        run: gdlint scripts tests tools

  test:
    name: Headless tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: Import project
        run: godot --headless --path . --import || true
      - name: Run tests
        run: godot --headless --path . -s tests/run_tests.gd
      - name: Balance report (40 seeded fights per policy)
        run: godot --headless --path . -s tools/autobattle.gd -- 40 | tee balance.txt
      - name: Add balance to the run summary
        run: |
          echo '### Auto-battle balance' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'wins' balance.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android debug APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: Cache export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}
      - name: Install export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Point Godot at the Android SDK and Java
        run: |
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
            cat > ~/.config/godot/$f <<CFG
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          CFG
          done
      - name: Make a debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$PWD/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Import project
        run: godot --headless --path . --import || true
      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/emberwake-debug.apk
          ls -la build
          test -s build/emberwake-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: emberwake-android-debug
          path: build/emberwake-debug.apk
          retention-days: 14

  screens:
    name: Layout screenshots
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and a virtual display
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1 > /dev/null
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: Import project
        run: godot --headless --path . --import || true
      - name: Capture phone and foldable layouts
        run: |
          mkdir -p screens
          while read -r w h name; do
            xvfb-run -a -s "-screen 0 2600x2300x24" godot --path . --rendering-driver opengl3 \
              -s tools/shot.gd -- "$w" "$h" "screens/$name.png" 300
            test -s "screens/$name.png"
          done <<LIST
          2400 1080 phone-20x9
          2520 1080 fold7-cover
          2184 1968 fold7-open
          1968 2184 fold7-open-portrait
          2556 1179 iphone-16
          LIST
      - uses: actions/upload-artifact@v4
        with:
          name: layout-screenshots
          path: screens/
          retention-days: 14
