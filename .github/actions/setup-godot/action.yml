name: Set up Godot
description: Installs the pinned Godot editor (cached) and imports the project.
inputs:
  version:
    description: Godot version, e.g. 4.7.2
    required: true
runs:
  using: composite
  steps:
    - name: Cache the Godot editor
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/godot-bin
        key: godot-editor-${{ inputs.version }}
    - name: Download Godot
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/godot-bin
        curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${{ inputs.version }}-stable/Godot_v${{ inputs.version }}-stable_linux.x86_64.zip"
        unzip -q godot.zip -d ~/godot-bin
        rm godot.zip
    - name: Put Godot on the path
      shell: bash
      run: sudo ln -sf ~/godot-bin/Godot_v${{ inputs.version }}-stable_linux.x86_64 /usr/local/bin/godot
    - name: Import project
      shell: bash
      # A broken asset must fail here, not later as a confusing test or export error.
      run: tools/ci_godot.sh --headless --path . --import
